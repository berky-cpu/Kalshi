// Install to /etc/apt/apt.conf.d/99kbtc-no-reboot
// Never let unattended-upgrades reboot the box on its own (a kernel update would otherwise reboot
// and interrupt recording). Reboots are done manually/under supervision.
Unattended-Upgrade::Automatic-Reboot "false";
Unattended-Upgrade::Automatic-Reboot-WithUsers "false";
