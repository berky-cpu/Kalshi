# Install to /etc/needrestart/conf.d/zz-kbtc-no-restart.conf
#
# Stop needrestart (invoked by unattended-upgrades) from AUTO-RESTARTING services after a library
# upgrade. The 2026-10-18 incident: an unattended-upgrades run bounced all recorders, and one came
# back connected-but-silent for 11h. With list-only mode, security patches still INSTALL but services
# keep running the old libs until a controlled restart — fine for a market-data reader on a dedicated
# box. (Defense in depth: the in-process data-staleness watchdog also self-heals a bad restart.)
$nrconf{restart} = 'l';
