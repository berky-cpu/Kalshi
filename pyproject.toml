[project]
name = "kbtc"
version = "0.1.0"
description = "Maker-only, model-priced market making research for Kalshi KXBTC15M (paper trading only)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Berk" }]
dependencies = [
    "zstandard>=0.23",
    "websockets>=13",
    "numpy>=2.0",
    "polars>=1.0",
    "pyarrow>=17",
    "sortedcontainers>=2.4.0",
    "cryptography>=43",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbtc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
